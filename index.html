<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Título que aparecerá en la pestaña del navegador -->
    <title>Lista de tareas</title>

    <!-- Conectamos el archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Lista de tareas</h1>

    <!-- Campo donde escribiremos una tarea -->
    <input type="text" id="tarea" placeholder="Escribe una tarea">

    <!-- Botón para añadir la tarea -->
    <button id="btnAgregar">Añadir tarea</button>

    <!-- Aquí aparecerán las tareas -->
    <ul id="listaTareas"></ul>

    <!-- Conectamos JavaScript -->
    <script src="script.js"></script>

</body>

</html>
